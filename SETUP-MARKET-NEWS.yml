name: Market News Journal Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build the complete project
        env:
          F0: 
          F1: 
          F2: 
          F3: 
          F4: 
          F5: 
          F6: 
          F7: 
        run: |
          python3 - <<'PY'
          import os, base64, pathlib
          files = {
              'F0': 'index.html',
              'F1': 'styles.css',
              'F2': 'app.js',
              'F3': 'README.md',
              'F4': 'STAGE-2-SETUP.md',
              'F5': 'data/reports.json',
              'F6': 'scripts/generate_report.py',
              'F7': '.github/workflows/daily-news.yml',
          }
          for key, path in files.items():
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(os.environ[key]))
          print("Stage 2 files created successfully.")
      - name: Commit complete project
        run: |
          git config user.name "market-news-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm -f SETUP-MARKET-NEWS.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Install Market News Journal Stage 2"
          git push
