name: Daily Market News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.makedirs("data", exist_ok=True)

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%Y-%m-%d")

          prompt = """
          Create a concise Indian stock-market morning intelligence report.

          Return ONLY valid JSON with these keys:

          {
            "date": "",
            "mood": "",
            "summary": "",
            "drivers": [],
            "news": [],
            "market_effect": [],
            "learning": [],
            "history": []
          }

          Focus on:
          - Nifty
          - Sensex
          - crude oil
          - USD/INR
          - FII/DII
          - major global cues
          - important Indian market news
          - likely market impact

          Do not invent live prices.
          If live data is unavailable, explicitly say so.
          """

          body = json.dumps({
              "model": "gpt-4o-mini",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.2
          }).encode()

          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          content = result["choices"][0]["message"]["content"]

          if content.startswith("```"):
              content = content.replace("```json", "")
              content = content.replace("```", "")
              content = content.strip()

          report = json.loads(content)

          path = "data/reports.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  database = json.load(f)
          except Exception:
              database = {"reports": []}

          database["reports"] = [
              r for r in database["reports"]
              if r.get("date") != today
          ]

          report["date"] = today
          report["generated_at"] = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).isoformat()

          database["reports"].insert(0, report)

          database["reports"] = database["reports"][:90]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(
                  database,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Daily market report saved.")
          PY

      - name: Commit updated report
        run: |
          git config user.name "market-news-bot"
          git config user.email "actions@github.com"
          git add data/reports.json
          git diff --cached --quiet || git commit -m "Update daily market report"
          git push
