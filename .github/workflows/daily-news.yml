name: Daily Market News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily report
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          prompt = """Create a concise Indian stock-market
          pre-open report for today.

          Return ONLY valid JSON with these keys:
          date,time,mood,summary,stats,drivers,setup,news,learning,history.

          stats: nifty, crude, usdinr, fii.
          drivers: arrays of [icon,title,why,priority].
          setup: six strings.
          news: [title,why,market_effect,bias].
          learning: [title,explanation].
          history: [date,mood,summary].

          Do not invent live prices.
          Use "—" when live data is unavailable.
          """

          body = json.dumps({
              "model": "gpt-4o-mini",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.2
          }).encode()

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as r:
              obj = json.load(r)

          content = obj["choices"][0]["message"]["content"].strip()

          if content.startswith("```"):
              content = content.split("\n", 1)[1]
              content = content.rsplit("```", 1)[0]

          data = json.loads(content)

          with open(
              "data/reports.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {"reports": [data]},
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit updated report
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          git config user.name "market-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/reports.json

          git diff --cached --quiet || \
            git commit -m "Update daily market report"

          git push
