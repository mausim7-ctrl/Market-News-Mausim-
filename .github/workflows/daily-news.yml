name: Daily Market News Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/reports.json"

  workflow_dispatch:

  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-market-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. CHECK SECRET
      # --------------------------------------------------
      - name: Check OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is NOT available."
            echo "Please check:"
            echo "Repository → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "OPENAI_API_KEY available: True"


      # --------------------------------------------------
      # 3. GENERATE DAILY REPORT
      # --------------------------------------------------
      - name: Generate daily report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ==================================================
          # BASIC SETTINGS
          # ==================================================

          DATA_DIR = "data"
          REPORT_FILE = "data/reports.json"

          os.makedirs(DATA_DIR, exist_ok=True)

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d %B %Y")

          current_time = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%I:%M %p IST")


          # ==================================================
          # CHECK API KEY
          # ==================================================

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError(
                  "OPENAI_API_KEY is not available."
              )


          # ==================================================
          # DEFAULT FALLBACK REPORT
          # ==================================================

          fallback_report = {
              "date": today,
              "time": current_time,
              "mood": "Cautious",
              "summary": "Daily Indian market pre-open report could not be generated.",
              "stats": {
                  "nifty": "--",
                  "sensex": "--",
                  "bank_nifty": "--",
                  "crude": "--",
                  "usdinr": "--",
                  "fii": "--",
                  "dii": "--"
              },
              "drivers": [
                  "Awaiting market data confirmation"
              ],
              "setup": [
                  "First resistance",
                  "Key support"
              ],
              "news": [],
              "learning": [],
              "history": []
          }


          # ==================================================
          # PROMPT
          # ==================================================

          prompt = f"""
          Create a concise Indian stock-market pre-open report
          for {today}.

          Current time:
          {current_time}

          Return ONLY valid JSON.

          Required top-level keys:

          date
          time
          mood
          summary
          stats
          drivers
          setup
          news
          learning
          history

          The stats object must contain:

          nifty
          sensex
          bank_nifty
          crude
          usdinr
          fii
          dii

          IMPORTANT:

          1. Do NOT invent live market prices.
          2. If reliable live data is unavailable, use "--".
          3. Clearly distinguish confirmed information from expectations.
          4. Keep the report useful for an Indian retail trader.
          5. Explain important market drivers simply.
          6. Do not provide guaranteed predictions.
          7. Do not invent news headlines.
          8. If no reliable news is available, return an empty array.
          9. Return JSON only.
          """


          # ==================================================
          # OPENAI API REQUEST
          # ==================================================

          body = json.dumps({
              "model": "gpt-4o-mini",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a careful Indian stock-market "
                          "research assistant. Never invent live "
                          "prices or unverified market facts."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.2
          }).encode("utf-8")


          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )


          # ==================================================
          # CALL OPENAI
          # ==================================================

          report = None

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  raw_response = response.read().decode("utf-8")

                  result = json.loads(raw_response)

              content = (
                  result["choices"][0]
                  ["message"]["content"]
                  .strip()
              )


              # ------------------------------------------------
              # Remove markdown code fences if model adds them
              # ------------------------------------------------

              if content.startswith("```"):

                  lines = content.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  content = "\n".join(lines).strip()


              if content.startswith("json"):
                  content = content[4:].strip()


              report = json.loads(content)


          except urllib.error.HTTPError as e:

              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  "OpenAI HTTP error:",
                  e.code,
                  error_body
              )

          except urllib.error.URLError as e:

              print(
                  "OpenAI network error:",
                  e
              )

          except json.JSONDecodeError as e:

              print(
                  "OpenAI returned invalid JSON:",
                  e
              )

          except Exception as e:

              print(
                  "AI generation failed:",
                  e
              )


          # ==================================================
          # FALLBACK
          # ==================================================

          if not isinstance(report, dict):

              print(
                  "Using fallback report."
              )

              report = fallback_report


          # ==================================================
          # FORCE REQUIRED FIELDS
          # ==================================================

          report.setdefault("date", today)

          report.setdefault(
              "time",
              current_time
          )

          report.setdefault(
              "mood",
              "Cautious"
          )

          report.setdefault(
              "summary",
              ""
          )

          report.setdefault(
              "stats",
              {}
          )

          report.setdefault(
              "drivers",
              []
          )

          report.setdefault(
              "setup",
              []
          )

          report.setdefault(
              "news",
              []
          )

          report.setdefault(
              "learning",
              []
          )

          report.setdefault(
              "history",
              []
          )


          # ==================================================
          # FORCE STATS FIELDS
          # ==================================================

          stats = report["stats"]

          if not isinstance(stats, dict):
              stats = {}

          for key in [
              "nifty",
              "sensex",
              "bank_nifty",
              "crude",
              "usdinr",
              "fii",
              "dii"
          ]:

              stats.setdefault(key, "--")

          report["stats"] = stats


          # ==================================================
          # READ OLD REPORT FILE
          # ==================================================

          old_data = {
              "reports": []
          }

          if os.path.exists(REPORT_FILE):

              try:

                  with open(
                      REPORT_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_data = json.load(f)

              except Exception as e:

                  print(
                      "Could not read existing reports:",
                      e
                  )


          reports = old_data.get(
              "reports",
              []
          )

          if not isinstance(reports, list):
              reports = []


          # ==================================================
          # REMOVE DUPLICATE REPORT FOR SAME DATE
          # ==================================================

          reports = [
              r for r in reports
              if r.get("date") != today
          ]


          # ==================================================
          # ADD TODAY'S REPORT
          # ==================================================

          reports.insert(
              0,
              report
          )


          # Keep last 60 reports only
          reports = reports[:60]


          # ==================================================
          # SAVE
          # ==================================================

          final_data = {
              "reports": reports
          }


          with open(
              REPORT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Saved daily report."
          )

          print(
              "Date:",
              report.get("date")
          )

          print(
              "Mood:",
              report.get("mood")
          )

          print(
              "Reports stored:",
              len(reports)
          )

          PY


      # --------------------------------------------------
      # 4. CHECK GENERATED FILE
      # --------------------------------------------------
      - name: Validate generated report
        run: |

          python - <<'PY'

          import json

          path = "data/reports.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if "reports" not in data:
              raise RuntimeError(
                  "reports.json does not contain 'reports'."
              )

          if not isinstance(
              data["reports"],
              list
          ):
              raise RuntimeError(
                  "'reports' must be a list."
              )

          if len(data["reports"]) == 0:
              raise RuntimeError(
                  "No reports found."
              )

          print(
              "Report validation successful."
          )

          print(
              "Number of reports:",
              len(data["reports"])
          )

          PY


      # --------------------------------------------------
      # 5. COMMIT REPORT
      # --------------------------------------------------
      - name: Commit updated report
        run: |

          git config user.name "market-news-bot"
          git config user.email "market-news-bot@users.noreply.github.com"

          git add data/reports.json

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit \
            -m "Daily Market News Update"

          git push
